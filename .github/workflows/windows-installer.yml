name: Windows installer / مثبت Windows
on:
  workflow_dispatch:
  push:
    branches: [sprint-01-provider-v1.1, main]
    paths:
      - packaging/**
      - tools/build_windows.py
      - desktop.py
      - provider/**
      - tests/**
      - .github/workflows/windows-installer.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools / تجهيز أدوات البناء
        shell: pwsh
        run: |
          python -m pip install -r packaging/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build dependencies failed' }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Compiler installation failed' }
      - name: Tests and installer / الاختبارات والمثبت
        shell: pwsh
        run: |
          python -X utf8 -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python -X utf8 tools/build_windows.py --iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Install and uninstall / التثبيت والإزالة
        shell: pwsh
        run: ./tools/test_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer
      - name: Publish trial download / نشر تنزيل تجريبي
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-preview-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" installer/* --target "$GITHUB_SHA" --prerelease --title 'Share4AI Windows trial | نسخة Windows التجريبية' --notes-file packaging/RELEASE_NOTES.md
